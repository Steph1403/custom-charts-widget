# Déploiement automatique du widget sur GitHub Pages (branche gh-pages)
# à chaque modification de main.
# À placer dans votre fork à l'emplacement : .github/workflows/deploy.yml
name: Deploy widget to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet aussi de lancer le déploiement à la main (onglet Actions)

permissions:
  contents: write      # nécessaire pour pousser la branche gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        # npm install (et non npm ci) car le package-lock.json du repo est
        # désynchronisé de son package.json ; --legacy-peer-deps évite les
        # conflits de peer dependencies (react-chart-editor / react 18).
        # immutable est une peer-dependency de draft-js-utils (via
        # react-chart-editor) : install explicite indispensable au build.
        run: |
          npm install --legacy-peer-deps
          npm install immutable@^4 --legacy-peer-deps

      - name: Compiler le widget
        run: npm run build

      - name: Publier le dossier build/ sur la branche gh-pages
        # Utilise le GITHUB_TOKEN automatique de GitHub Actions pour
        # s'authentifier (évite l'erreur "could not read Username").
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
